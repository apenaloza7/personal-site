name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Replace Contentful placeholders with secrets
        run: |
          sed -i "s/YOUR_SPACE_ID_PLACEHOLDER/${{ secrets.CONTENTFUL_SPACE_ID }}/g" script.js
          sed -i "s/YOUR_ACCESS_TOKEN_PLACEHOLDER/${{ secrets.CONTENTFUL_ACCESS_TOKEN }}/g" script.js
      
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          commit_message: "Deploy to GitHub Pages"